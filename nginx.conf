server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset UTF-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    # Set here only: nginx drops inherited add_header lines in any location
    # that has its own add_header, so the locations below use `expires`.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # vue-router uses history mode: every path that is not a file gets the app
    location / {
        try_files $uri /index.html;
    }

    # Never cached, so a new deploy shows up on the next page load
    location = /index.html {
        expires -1;
    }

    # Vite names built files <name>-<8 character hash>.<ext>: safe to cache
    # for a year. A missing one is a 404, not the app (a stale page asking for
    # a chunk from an older build must not be handed HTML).
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$" {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else under /assets/ (vendor files copied from public/)
    location /assets/ {
        try_files $uri =404;
    }
}
