name: Checks and deploy

on:
    pull_request:
        branches:
            - master
    push:
        branches:
            - master


jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
              node-version: '22'   # the same major as the Dockerfile
              cache: npm

        - name: Install dependencies
          run: npm ci

        # Fails on any error; the codebase is at zero
        - name: Lint
          run: npx eslint src

        # Fails on any unformatted file; run `npm run format` to fix
        - name: Check formatting
          run: npm run format:check

    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
              node-version: '22'   # the same major as the Dockerfile
              cache: npm

        - name: Install dependencies
          run: npm ci

        - name: Run the tests
          run: npm test

    build-image:
        name: Build image
        runs-on: ubuntu-24.04-arm   # native arm64 runner: the Hetzner server is aarch64
        permissions:
            contents: read
            packages: write
        outputs:
            short_sha: ${{ steps.short_sha.outputs.value }}

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set short SHA
          id: short_sha
          run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

        # The Dockerfile runs `npm ci` and `npm run build`, so a broken build
        # stops here and nothing is deployed. On a pull request this is the whole
        # job: the image is built but not pushed.
        - name: Build the image
          uses: docker/build-push-action@v6
          with:
              context: .
              push: false
              load: true
              tags: invoicer-vue:check

        # A broken nginx.conf would otherwise only show when the container fails
        # to start after the deploy
        - name: Check the nginx config
          run: docker run --rm invoicer-vue:check nginx -t

        - name: Log in to GitHub Container Registry
          if: github.event_name == 'push'
          uses: docker/login-action@v3
          with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

        # Same build again: every layer comes from the cache
        - name: Push the image
          if: github.event_name == 'push'
          uses: docker/build-push-action@v6
          with:
              context: .
              push: true
              tags: |
                ghcr.io/wayand/invoicer-vue:latest
                ghcr.io/wayand/invoicer-vue:${{ steps.short_sha.outputs.value }}

    deploy:
        name: Deploy to invoicer.wayand.dk
        runs-on: ubuntu-latest
        needs: [lint, test, build-image]
        if: github.event_name == 'push'   # not on pull requests

        steps:
        - name: Set up SSH
          run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H ${{ secrets.HETZNER_IP_ADDRESS }} >> ~/.ssh/known_hosts

        - name: Run deploy script
          run: ssh www-data@${{ secrets.HETZNER_IP_ADDRESS }} "IMAGE_TAG=${{ needs.build-image.outputs.short_sha }} bash /srv/docker/invoicer/deploy.sh web"
