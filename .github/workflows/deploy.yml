name: Deploy Vue App to Hetzner

on:
    push:
        branches:
            - master


jobs:
    build-image:
        name: Build and push Docker image
        runs-on: ubuntu-24.04-arm   # native arm64 runner: the Hetzner server is aarch64
        permissions:
            contents: read
            packages: write
        outputs:
            short_sha: ${{ steps.short_sha.outputs.value }}

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set short SHA
          id: short_sha
          run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

        # The Dockerfile runs `npm ci` and `npm run build`, so a broken build
        # stops here and nothing is deployed.
        - name: Build and push
          uses: docker/build-push-action@v6
          with:
              context: .
              push: true
              tags: |
                ghcr.io/wayand/invoicer-vue:latest
                ghcr.io/wayand/invoicer-vue:${{ steps.short_sha.outputs.value }}

    deploy:
        name: Deploy to invoicer.wayand.dk
        runs-on: ubuntu-latest
        needs: build-image

        steps:
        - name: Set up SSH
          run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H ${{ secrets.HETZNER_IP_ADDRESS }} >> ~/.ssh/known_hosts

        - name: Run deploy script
          run: ssh www-data@${{ secrets.HETZNER_IP_ADDRESS }} "IMAGE_TAG=${{ needs.build-image.outputs.short_sha }} bash /srv/docker/invoicer/deploy.sh web"
